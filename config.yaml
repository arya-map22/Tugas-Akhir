# Mode = "train" | "tune" | "inference"
mode: "inference"

seed: 42

split:
  train: 0.7
  validation: 0.15
  test: 0.15

data:
  mortalitas:
    year_col: "year"
    date_format: "%Y"
    age_col: "age"
    sex_col: "sex"
    mortality_col: "mortality_rate"

  bi_rate:
    date_col: "date"
    date_format: "%d-%m-%y"

dataset:
  lookback: 10
  horizon: 1

training:
  batch_size: 16
  min_epochs: 0
  max_epochs: 500

  # NAdam
  optimizer:
    lr: 2e-3

  # Warm-up + CosineAnnealingWarmupRestart
  lr_scheduler:
    # Warm-up
    warm_up_epochs: 5
    start_factor: 1e-2
    end_factor: 1.0

    # CosineAnnealingWarmupRestart
    T_0: 20
    T_mult: 2
    eta_min: 1e-5

  # ElasticNet
  regularization:
    alfa: 1

tuning:
  eta_candidates: [ 1e-6, 5e-6, 1e-5, 5e-5, 1e-4, 5e-4, 1e-3, 5e-3, 1e-2, 0 ]

model:
  num_ensembles: 10
  localglmnet:
    bias: true

  lcn:
    kernel_size: 5
    stride: 1
    dilation: 1
    zero_padding: true
    bias: true